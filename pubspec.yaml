name: modern_notes_app
description: Aplikasi Notes Modern Material 3 dengan penyimpanan lokal SharedPreferences.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.2.3

dependency_overrides:
  shared_preferences_android: 2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
